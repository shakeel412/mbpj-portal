const L=[['membership.html','رکنیت فارم','fa-id-card'],['kunri-region.html','کنری ریجن','fa-map-location-dot'],['karachi-region.html','کراچی ریجن','fa-city'],...D.map(d=>[d.f,d.t,d.i])];

document.getElementById('gal').innerHTML=['اجلاس','طبی کیمپ','راشن تقسیم','کھیلوں کا میلہ','تعلیمی تقریب','اجتماع'].map((t,i)=>`<div class="card h-40 rounded-2xl bg-gradient-to-br ${['from-emerald-800 to-emerald-500','from-amber-600 to-amber-400'][i%2]} text-white flex flex-col items-center justify-center overflow-hidden" data-aos="zoom-in"><i class="fa-solid fa-image text-3xl"></i><span class="nast">${t}</span></div>`).join('');
